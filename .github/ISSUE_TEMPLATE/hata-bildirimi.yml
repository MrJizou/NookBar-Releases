name: Hata bildirimi
description: Bir şey beklendiği gibi çalışmıyor
title: "[Hata] "
labels: ["hata"]
body:
  - type: markdown
    attributes:
      value: Bildirdiğin için teşekkürler. Ne kadar ayrıntı verirsen o kadar hızlı düzeltilir.
  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu?
      description: Gördüğün sorun. Ekran görüntüsü ekleyebilirsin (adanın kendisi ekran görüntülerinde görünmez; telefonla çekebilirsin).
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır?
      placeholder: |
        1. Spotify'da bir şarkı aç
        2. Adanın üzerine gel
        3. ...
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: Ne olmasını bekliyordun?
  - type: input
    id: surum
    attributes:
      label: NookBar sürümü
      description: Tepsi simgesi → Değişiklik günlüğü'nde en üstteki sürüm
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows sürümü
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: ekran
    attributes:
      label: Ekran düzeni
      options:
        - Tek ekran
        - Birden çok ekran
  - type: textarea
    id: ek
    attributes:
      label: Eklemek istediğin başka bir şey
